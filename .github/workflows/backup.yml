# Phase 8: nightly backup of the live database, proved restorable in the same run.
# The dump holds household data, so it is encrypted before it is stored as an artifact.
name: Nightly backup

on:
  schedule:
    - cron: "30 16 * * *" # 02:30 in Sydney (AEST), when nobody is studying
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          mkdir -p backup
          supabase db dump --linked -f backup/roles.sql --role-only
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked -f backup/data.sql --use-copy --data-only --schema public
          supabase db dump --linked -f backup/auth.sql --use-copy --data-only --schema auth
          ls -l backup

      - name: Restore into a fresh database and compare every table with the dump
        run: |
          supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,mailpit,postgrest,gotrue,kong,postgres-meta,supavisor
          bash scripts/backup-restore-check.sh backup "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Encrypt
        run: |
          tar czf backup.tgz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -c -o "openigcse-$(date -u +%F).tgz.gpg" backup.tgz
          rm -rf backup backup.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: openigcse-backup-${{ github.run_id }}
          path: openigcse-*.tgz.gpg
          retention-days: 30
